<body>
  <div class="card">
    <h1>מאמן חשבון לילדים</h1>

    <div id="menu" class="menu">
      <h2>בחר שלב</h2>
      <button data-level="1">שלב 1 — חיבור עד 5</button><br>
      <button data-level="2">שלב 2 — חיבור עד 10</button>
      <div class="small">אפשר לענות בקול או להקליד מספר</div>
    </div>

    <div id="game" hidden>
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>

      <button id="voiceBtn">🎤 תשובה בקול</button>
      <div class="status" id="voiceStatus"></div>
      <div class="heard" id="heard"></div>

      <input id="answer" type="number" min="0" max="10" inputmode="numeric" aria-label="תשובה" />
      <br />
      <button id="checkBtn">בדיקה</button>

      <div class="feedback" id="feedback"></div>
      <div class="small" id="levelLabel"></div>
    </div>

    <div id="finish" hidden>
      <div class="summary" id="summary"></div>
      <button id="restartBtn">התחלה מחדש</button>
      <button id="menuBtn">בחירת שלב</button>
    </div>
  </div>

<script>
(() => {
  const TOTAL = 10;
  let level = 1;
  let index = 0;
  let correct = 0;
  let attempts = 0;
  let current = null;
  let recognition = null;
  let recognizing = false;
  let voiceMode = false;
  let restartVoiceAfterEnd = false;
  const menuEl = document.getElementById('menu');
  const gameEl = document.getElementById('game');
  const finishEl = document.getElementById('finish');
  const qEl = document.getElementById('question');
  const pEl = document.getElementById('progress');
  const aEl = document.getElementById('answer');
  const fEl = document.getElementById('feedback');
  const heardEl = document.getElementById('heard');
  const voiceStatusEl = document.getElementById('voiceStatus');
  const levelLabelEl = document.getElementById('levelLabel');
  const checkBtn = document.getElementById('checkBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const summaryEl = document.getElementById('summary');

  const numberWords = {
    "אפס": 0, "אחת": 1, "אחד": 1,
    "שתיים": 2, "שניים": 2, "שתי": 2, "שני": 2,
    "שלוש": 3, "שלושה": 3,
    "ארבע": 4, "ארבעה": 4,
    "חמש": 5, "חמישה": 5,
    "שש": 6, "שישה": 6,
    "שבע": 7, "שבעה": 7,
    "שמונה": 8,
    "תשע": 9, "תשעה": 9,
    "עשר": 10, "עשרה": 10
  };

  function hebrewNumber(n) {
    return ['אפס','אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע','עשר'][n] || String(n);
  }

 function speak(text, onEnd = null) {
    if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
    }

    window.speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL';
    u.rate = 0.9;

    if (onEnd) {
        u.onend = onEnd;
        u.onerror = onEnd;
    }

    window.speechSynthesis.speak(u);
}

  function randomQuestion() {
    const max = level === 1 ? 5 : 10;
    let a, b, sum;
    do {
      a = Math.floor(Math.random() * (max - 1)) + 1;
      b = Math.floor(Math.random() * (max - 1)) + 1;
      sum = a + b;
    } while (sum > max || (level === 2 && sum <= 5));
    return { a, b, answer: sum };
  }

  function ask() {
    attempts = 0;
    current = randomQuestion();
    pEl.textContent = `שאלה ${index + 1} מתוך ${TOTAL}`;
    qEl.innerHTML = `<span dir="ltr">?</span> = <span dir="ltr">${current.b}</span> + <span dir="ltr">${current.a}</span>`;
    fEl.textContent = '';
    heardEl.textContent = '';
    voiceStatusEl.textContent = '';
    aEl.value = '';
    aEl.focus();
    speak(`כמה זה ${hebrewNumber(current.a)} ועוד ${hebrewNumber(current.b)}?`, () => {
      if (voiceMode) {
          setTimeout(startVoice, 250);
      }
    });
  }

  function next() {
    index++;
    if (index >= TOTAL) {
      finish();
      return;
    }
    setTimeout(ask, 900);
  }

  function checkAnswer(value) {
    if (Number.isNaN(value)) {
      fEl.textContent = 'לא הבנתי את התשובה';
      speak('לא הבנתי את התשובה', () => {
          if (voiceMode) startVoice();
      });
      return;
    }

    attempts++;

    if (value === current.answer) {
      correct++;
      fEl.textContent = 'נכון! כל הכבוד!';
      speak('נכון! כל הכבוד!');
      disableInput(true);
      setTimeout(() => {
        disableInput(false);
        next();
      }, 1000);
    } else if (attempts < 3) {
      fEl.textContent = 'לא נכון. נסה שוב.';
      speak('לא נכון. נסה שוב.', () => {
          resumeVoice();
      });
      aEl.select();
    } else {
      fEl.textContent = `התשובה הנכונה היא ${current.answer}`;
      speak(`התשובה הנכונה היא ${hebrewNumber(current.answer)}`);
      disableInput(true);
      setTimeout(() => {
        disableInput(false);
        next();
      }, 1500);
    }
  }

  function disableInput(disabled) {
    aEl.disabled = disabled;
    checkBtn.disabled = disabled;
    voiceBtn.disabled = disabled;
  }

  function parseSpokenAnswer(text) {
    const cleaned = text.trim().replace(/[.,!?]/g, '');
    const digitMatch = cleaned.match(/\d+/);
    if (digitMatch) return Number(digitMatch[0]);

    if (numberWords.hasOwnProperty(cleaned)) return numberWords[cleaned];

    for (const [word, value] of Object.entries(numberWords)) {
      if (cleaned.includes(word)) return value;
    }
    return NaN;
  }

  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      voiceBtn.disabled = true;
      voiceStatusEl.textContent = 'זיהוי קולי אינו נתמך בדפדפן הזה';
      return;
    }

    recognition = new SR();
    recognition.lang = 'he-IL';
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;
    recognition.continuous = false;

    recognition.onstart = () => {
      recognizing = true;
      voiceStatusEl.textContent = 'מקשיב...';
      heardEl.textContent = '';
    };

    recognition.onend = () => {
        recognizing = false;
    
        if (voiceStatusEl.textContent === 'מקשיב...') {
            voiceStatusEl.textContent = '';
        }
    
        if (voiceMode && restartVoiceAfterEnd) {
            restartVoiceAfterEnd = false;
            setTimeout(startVoice, 300);
        }
    };

  recognition.onerror = (event) => {
    recognizing = false;
    voiceStatusEl.textContent = 'לא הצלחתי לשמוע. נסה שוב.';

    if (event.error === 'not-allowed') {
        voiceStatusEl.textContent = 'יש לאשר גישה למיקרופון בדפדפן';
    }
  };

  recognition.onresult = (event) => {
    voiceStatusEl.textContent = '';

    let recognizedTexts = [];
    let matchedValue = NaN;
    let matchedText = '';
    let fallbackValue = NaN;
    let fallbackText = '';

    for (let i = 0; i < event.results[0].length; i++) {
        const text = event.results[0][i].transcript.trim();
        recognizedTexts.push(text);
    
        const value = parseSpokenAnswer(text);
    
        if (!Number.isNaN(value)) {
            if (value === current.answer) {
                matchedValue = value;
                matchedText = text;
                break;
            }
    
            if (Number.isNaN(fallbackValue)) {
                fallbackValue = value;
                fallbackText = text;
            }
        }
    }

    if (Number.isNaN(matchedValue) && !Number.isNaN(fallbackValue)) {
        matchedValue = fallbackValue;
        matchedText = fallbackText;
    }

   if (!Number.isNaN(matchedValue)) {
        heardEl.textContent = 'שמעתי: ' + matchedText;
        aEl.value = matchedValue;
        setTimeout(() => checkAnswer(matchedValue), 250);
    } else {
        heardEl.textContent = 'שמעתי: ' + recognizedTexts.join(' / ');
        fEl.textContent = 'לא הבנתי את המספר. נסה שוב.';
        speak('לא נכון. נסה שוב.', () => {
            resumeVoice();
        });
    }
};
  }
  function resumeVoice() {
      if (!voiceMode) return;
  
      if (recognizing) {
          restartVoiceAfterEnd = true;
      } else {
          restartVoiceAfterEnd = false;
          setTimeout(startVoice, 300);
      }
  }
  function startVoice() {
    if (!recognition) {
      setupRecognition();
      if (!recognition) return;
    }
    if (recognizing) return;

    try {
      recognition.start();
    } catch (e) {
      voiceStatusEl.textContent = 'נסה שוב בעוד רגע';
    }
  }
  function toggleVoiceMode() {
    voiceMode = !voiceMode;

    if (voiceMode) {
        voiceBtn.textContent = 'כבה מצב קולי 🔇';
        voiceStatusEl.textContent = 'מצב קולי פעיל';
        startVoice();
    } else {
        voiceBtn.textContent = 'תשובה בקול 🎤';
        voiceStatusEl.textContent = '';

        if (recognition && recognizing) {
            try {
                recognition.abort();
            } catch (e) {}
        }
    }
}
  function startLevel(selectedLevel) {
    level = selectedLevel;
    index = 0;
    correct = 0;
    menuEl.hidden = true;
    finishEl.hidden = true;
    gameEl.hidden = false;
    levelLabelEl.textContent = level === 1 ? 'שלב 1: חיבור עד 5' : 'שלב 2: חיבור מ-5 עד 10';
    ask();
  }

  function finish() {
    gameEl.hidden = true;
    finishEl.hidden = false;
    summaryEl.innerHTML =
      `<strong>סיימנו!</strong><br>` +
      `פתרת נכון ${correct} מתוך ${TOTAL} שאלות.`;
    speak(`סיימנו. פתרת נכון ${correct} מתוך ${TOTAL} שאלות.`);
  }

  function backToMenu() {
    gameEl.hidden = true;
    finishEl.hidden = true;
    menuEl.hidden = false;
  }

  document.querySelectorAll('[data-level]').forEach(btn => {
    btn.addEventListener('click', () => startLevel(Number(btn.dataset.level)));
  });

  checkBtn.addEventListener('click', () => {
    if (aEl.value === '') {
      fEl.textContent = 'נא להקליד תשובה';
      speak('נא להקליד תשובה');
      return;
    }
    checkAnswer(Number(aEl.value));
  });

  voiceBtn.addEventListener('click', toggleVoiceMode);

  aEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkBtn.click();
  });

  document.getElementById('restartBtn').addEventListener('click', () => startLevel(level));
  document.getElementById('menuBtn').addEventListener('click', backToMenu);

  setupRecognition();
})();
</script>
